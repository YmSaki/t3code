name: T3CodeJP Windows distribution validation

on:
  push:
    branches: [codex/fork-release-foundation]
    paths:
      - .github/workflows/fork-windows-validation.yml
      - scripts/smoke-windows-installer.ps1
  workflow_dispatch:

concurrency:
  group: fork-windows-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BASELINE_VERSION: 1.0.0
  CANDIDATE_VERSION: 1.0.1
  T3CODE_TELEMETRY_CHANNEL: dev
  T3CODE_TELEMETRY_ENABLED: "false"

jobs:
  build:
    name: Build Linux CLI and Windows installers
    if: github.repository == 'YmSaki/t3codeJP' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      linux_cli_sha256: ${{ steps.candidate.outputs.linux_cli_sha256 }}
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: YmSaki/t3codeJP
      T3CODE_DESKTOP_SIGNED: "false"
      T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
      T3CODE_CLERK_PUBLISHABLE_KEY: ""
      T3CODE_CLERK_JWT_TEMPLATE: ""
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ""
      T3CODE_RELAY_URL: ""
      VITE_CLERK_PUBLISHABLE_KEY: ""
      VITE_CLERK_JWT_TEMPLATE: ""
      VITE_CLERK_CLI_OAUTH_CLIENT_ID: ""
      VITE_T3CODE_RELAY_URL: ""
      T3CODE_RELAY_CLIENT_OTLP_TRACES_URL: ""
      T3CODE_RELAY_CLIENT_OTLP_TRACES_DATASET: ""
      T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN: ""
      VITE_RELAY_OTLP_TRACES_URL: ""
      VITE_RELAY_OTLP_TRACES_DATASET: ""
      VITE_RELAY_OTLP_TRACES_TOKEN: ""
    steps:
      # actions/checkout's credential cleanup enumerates orphaned submodules in .repos.
      - name: Checkout source
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Parse installer smoke script
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/smoke-windows-installer.ps1'), [ref]$null, [ref]$errors
          )
          if ($errors) { throw ($errors.Message -join "`n") }

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Install Linux build tools and build resource monitors
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y patchelf libsecret-1-dev pkg-config build-essential
          manifest=native/resource-monitor/Cargo.toml
          cargo build --locked --release --manifest-path "$manifest" --target x86_64-unknown-linux-gnu
          cargo xwin build --locked --release --manifest-path "$manifest" --target x86_64-pc-windows-msvc

      - name: Build and smoke-test candidate Linux CLI and package Windows installer
        id: candidate
        shell: bash
        env:
          APP_VERSION: ${{ env.CANDIDATE_VERSION }}
          pnpm_config_prefer_offline: "true"
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$APP_VERSION"
          vp run build:desktop:bundle
          node scripts/apply-web-brand-assets.ts production apps/server/dist/client
          node apps/server/scripts/cli.ts build-exe --verbose
          monitor_dir="$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          mkdir -p "$monitor_dir"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$monitor_dir/"
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$APP_VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          archive="release-cli/t3-$APP_VERSION-linux-x64.tar.gz"
          node scripts/smoke-cli-archive.ts --archive "$archive" --expect-version "$APP_VERSION"
          digest=$(sha256sum "$archive")
          echo "linux_cli_sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 \
            --build-version "$APP_VERSION" --skip-build --wsl-runtime "$archive" \
            --output-dir validation-candidate --verbose

      - name: Build older installer from the same source
        shell: bash
        env:
          APP_VERSION: ${{ env.BASELINE_VERSION }}
          pnpm_config_prefer_offline: "true"
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$APP_VERSION"
          vp run build:desktop:bundle
          # Only the candidate ships the WSL payload. The baseline exercises the same NSIS identity.
          vp run dist:desktop:artifact --platform win --target nsis --arch x64 \
            --build-version "$APP_VERSION" --skip-build --output-dir validation-baseline --verbose

      - name: Bundle existing Windows runtime verifier
        shell: bash
        run: |
          set -euo pipefail
          banner="import{createRequire as __cr}from'node:module';const require=__cr(import.meta.url);"
          scripts/node_modules/.bin/esbuild scripts/verify-windows-desktop-artifact.ts \
            --bundle --platform=node --format=esm --target=node24 --define:import.meta.main=false \
            --banner:js="$banner" --outfile=validation-verifier/verify-windows-desktop-artifact.mjs

      - name: Upload Windows validation inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-windows-x64-installers
          path: |
            validation-candidate/T3CodeJP-${{ env.CANDIDATE_VERSION }}-x64.exe
            validation-baseline/T3CodeJP-${{ env.BASELINE_VERSION }}-x64.exe
            validation-verifier/verify-windows-desktop-artifact.mjs
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload Linux CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-linux-x64-cli
          path: release-cli/t3-${{ env.CANDIDATE_VERSION }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  smoke:
    name: Verify Windows install, upgrade, and uninstall
    needs: build
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout smoke script
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_SHA"
          # Git Bash otherwise rewrites the anchored pattern as a Windows path.
          MSYS_NO_PATHCONV=1 git sparse-checkout set --no-cone '/scripts/smoke-windows-installer.ps1'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Set up Node for the runtime verifier
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download Windows validation inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-windows-x64-installers
          path: ${{ runner.temp }}/fork-windows-artifacts

      - name: Smoke-test against the official installation
        shell: pwsh
        env:
          LINUX_CLI_SHA256: ${{ needs.build.outputs.linux_cli_sha256 }}
        run: |
          $artifacts = Join-Path $env:RUNNER_TEMP 'fork-windows-artifacts'
          $root = Join-Path $env:RUNNER_TEMP "fork-windows-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          ./scripts/smoke-windows-installer.ps1 `
            -TestRoot $root `
            -BaselineInstaller (Join-Path $artifacts "validation-baseline/T3CodeJP-$env:BASELINE_VERSION-x64.exe") `
            -CandidateInstaller (Join-Path $artifacts "validation-candidate/T3CodeJP-$env:CANDIDATE_VERSION-x64.exe") `
            -RuntimeVerifier (Join-Path $artifacts 'validation-verifier/verify-windows-desktop-artifact.mjs') `
            -BaselineVersion $env:BASELINE_VERSION -CandidateVersion $env:CANDIDATE_VERSION `
            -LinuxCliSha256 $env:LINUX_CLI_SHA256
