name: T3CodeJP release

on:
  push:
    tags:
      - "v[1-9]*.*.*"
      - "!v*-nightly.*"
      - "!v*-preview.*"
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        default: preview
        options:
          - preview
          - stable
          - nightly
      version:
        description: Stable promotion version override (for example 1.2.3)
        type: string

# Prereleases take their base version from the published Stable release. Queue
# every run so a promotion and the next Nightly cannot plan against stale state.
concurrency:
  group: fork-release
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Plan fork release
    if: >-
      github.repository == 'YmSaki/t3code' &&
      (github.event_name != 'schedule' || vars.T3CODEJP_RELEASE_PUBLISH == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      release_channel: ${{ steps.plan.outputs.release_channel }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release_name: ${{ steps.plan.outputs.release_name }}
      draft: ${{ steps.plan.outputs.draft }}
      is_prerelease: ${{ steps.plan.outputs.is_prerelease }}
      make_latest: ${{ steps.plan.outputs.make_latest }}
      has_update_feed: ${{ steps.plan.outputs.has_update_feed }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Resolve fork release metadata
        id: plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_VERSION: ${{ inputs.version }}
          PAUSE_NIGHTLY: ${{ vars.PAUSE_NIGHTLY }}
        with:
          retries: 3
          script: |
            const { planForkRelease } = require('./.github/scripts/fork-release-policy.cjs');
            const plan = await planForkRelease({
              github,
              context,
              dispatchChannel: process.env.DISPATCH_CHANNEL || 'preview',
              dispatchVersion: process.env.DISPATCH_VERSION,
              pauseNightly: process.env.PAUSE_NIGHTLY === 'true',
            });

            core.setOutput('should_build', plan.shouldBuild);
            core.setOutput('release_channel', plan.channel);
            if (!plan.shouldBuild) {
              core.notice(plan.reason);
              return;
            }

            for (const [key, value] of Object.entries({
              ref: plan.ref,
              version: plan.version,
              tag: plan.tag,
              release_name: plan.name,
              draft: plan.draft,
              is_prerelease: plan.isPrerelease,
              make_latest: plan.makeLatest,
              has_update_feed: plan.hasUpdateFeed,
            })) {
              core.setOutput(key, value);
            }
            core.notice(`Planned ${plan.name} at ${plan.ref}.`);

  build_bundle:
    name: Build fork JavaScript bundle
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      database_migration: ${{ steps.migration.outputs.head }}
    env:
      T3CODE_TELEMETRY_CHANNEL: dev
      T3CODE_TELEMETRY_ENABLED: "false"
      T3CODE_CLERK_PUBLISHABLE_KEY: ""
      T3CODE_CLERK_JWT_TEMPLATE: ""
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ""
      T3CODE_RELAY_URL: ""
      VITE_CLERK_PUBLISHABLE_KEY: ""
      VITE_CLERK_JWT_TEMPLATE: ""
      VITE_CLERK_CLI_OAUTH_CLIENT_ID: ""
      VITE_T3CODE_RELAY_URL: ""
      T3CODE_RELAY_CLIENT_OTLP_TRACES_URL: ""
      T3CODE_RELAY_CLIENT_OTLP_TRACES_DATASET: ""
      T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN: ""
      VITE_RELAY_OTLP_TRACES_URL: ""
      VITE_RELAY_OTLP_TRACES_DATASET: ""
      VITE_RELAY_OTLP_TRACES_TOKEN: ""
    steps:
      - name: Checkout planned source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Resolve database migration head
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          head="$(node --input-type=module -e 'import { BUILD_MIGRATION_HEAD } from "./apps/server/src/persistence/databaseMigrationHead.ts"; console.log(BUILD_MIGRATION_HEAD)')"
          [[ "$head" =~ ^[0-9]+$ ]]
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Align package versions and build
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          node scripts/update-release-package-versions.ts "$VERSION"
          vp run build:desktop:bundle

      - name: Upload JavaScript bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Release quality (${{ matrix.suite }} ${{ matrix.shard }})
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: checks
          - suite: packages
          - suite: web
            shard: "1/2"
          - suite: web
            shard: "2/2"
          - suite: server
            shard: "1/8"
          - suite: server
            shard: "2/8"
          - suite: server
            shard: "3/8"
          - suite: server
            shard: "4/8"
          - suite: server
            shard: "5/8"
          - suite: server
            shard: "6/8"
          - suite: server
            shard: "7/8"
          - suite: server
            shard: "8/8"
    steps:
      - name: Checkout planned source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps

      - name: Install native build libraries and Electron
        if: matrix.suite == 'checks' || matrix.suite == 'packages'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config build-essential
          vp run --filter @t3tools/desktop ensure:electron

      - name: Check and typecheck
        if: matrix.suite == 'checks'
        run: |
          node --test .github/scripts/fork-release*.test.cjs
          vp check
          vp run typecheck

      - name: Test packages
        if: matrix.suite == 'packages'
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test

      - name: Test web
        if: matrix.suite == 'web'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
          vp run --filter @t3tools/web test --shard "$SHARD"

      - name: Boot the built web client
        if: matrix.suite == 'web' && matrix.shard == '1/2'
        run: |
          vp run --filter @t3tools/web build
          node apps/web/scripts/verify-built-boot.ts

      - name: Test server
        if: matrix.suite == 'server'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
          vp run --filter t3 test --shard "$SHARD"

  desktop:
    name: Desktop ${{ matrix.label }}
    needs: [preflight, build_bundle]
    if: needs.preflight.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
            cli_archive: true
            launch_check: true
          - label: macOS x64
            runner: macos-26-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
            cli_archive: false
            launch_check: true
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
            cli_archive: true
            launch_check: true
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            target: AppImage
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
            cli_archive: true
            launch_check: true
          - label: Windows x64
            runner: ubuntu-24.04
            verify_runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
            cli_archive: true
            launch_check: false
          - label: Windows arm64
            runner: ubuntu-24.04
            verify_runner: windows-11-arm
            platform: win
            target: nsis
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            resource_key: win32-arm64
            cli_archive: true
            launch_check: false
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      verify_runner: ${{ matrix.verify_runner || '' }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      cli_archive: ${{ matrix.cli_archive }}
      launch_check: ${{ matrix.launch_check }}
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      update_repository: YmSaki/t3code
      linux_executable_name: t3codejp
      skip_windows_signing_tools: true
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""

  collect:
    name: Validate fork release assets
    needs: [preflight, build_bundle, quality, desktop]
    if: >-
      needs.preflight.outputs.should_build == 'true' &&
      needs.build_bundle.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.desktop.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout planned source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download desktop artifacts separately
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release-inputs

      - name: Download CLI artifacts separately
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: release-inputs

      - name: Validate and stage assets
        env:
          CHANNEL: ${{ needs.preflight.outputs.release_channel }}
          VERSION: ${{ needs.preflight.outputs.version }}
          DATABASE_MIGRATION: ${{ needs.build_bundle.outputs.database_migration }}
        run: node .github/scripts/fork-release-assets.cjs release-inputs release-assets "$CHANNEL" "$VERSION" "$DATABASE_MIGRATION"

      - name: Merge desktop updater manifests
        if: needs.preflight.outputs.has_update_feed == 'true'
        run: node scripts/merge-release-update-manifests.ts release-assets

      - name: Upload validated release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release-assets
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish fork release
    needs: [preflight, collect]
    if: >-
      github.repository == 'YmSaki/t3code' &&
      vars.T3CODEJP_RELEASE_PUBLISH == 'true' &&
      needs.collect.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: YmSaki/t3code
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_REF: ${{ needs.preflight.outputs.ref }}
      RELEASE_NAME: ${{ needs.preflight.outputs.release_name }}
      RELEASE_DRAFT: ${{ needs.preflight.outputs.draft }}
      RELEASE_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
      RELEASE_LATEST: ${{ needs.preflight.outputs.make_latest }}
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-release-assets
          path: release-assets

      - name: Upload to a draft, then publish eligible releases
        shell: bash
        run: |
          set -euo pipefail
          tag_refs="$(git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          if [[ -n "$tag_refs" ]]; then
            tag_commit="$(awk 'NR == 1 { first = $1 } $2 ~ /\^\{\}$/ { peeled = $1 } END { print peeled ? peeled : first }' <<< "$tag_refs")"
            if [[ "$tag_commit" != "$RELEASE_REF" ]]; then
              echo "::error::Release tag resolves to a commit other than the validated source."
              exit 1
            fi
          fi
          args=(--draft --target "$RELEASE_REF" --title "$RELEASE_NAME")
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          if [[ "$RELEASE_DRAFT" == "true" ]]; then
            args+=(--notes "Maintainer preview. This draft has no update feed.")
          else
            args+=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" release-assets/* "${args[@]}"
          if [[ "$RELEASE_DRAFT" != "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest="$RELEASE_LATEST"
          fi

  nightly_pointer:
    name: Update fork Nightly pointer
    needs: [preflight, publish]
    if: >-
      github.repository == 'YmSaki/t3code' &&
      vars.T3CODEJP_RELEASE_PUBLISH == 'true' &&
      needs.preflight.outputs.release_channel == 'nightly' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: YmSaki/t3code
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - name: Point the Nightly feed to the published release
        shell: bash
        run: |
          set -euo pipefail
          latest_nightly="$(
            gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
              jq -er --arg tag "$RELEASE_TAG" '
                [.[][] | select(
                  .draft == false and .prerelease == true and .published_at != null and
                  (.tag_name | test("^v[1-9][0-9]*(\\.(0|[1-9][0-9]*)){2}-nightly\\.[0-9]{8}\\.[1-9][0-9]*$"))
                )]
                | if any(.[]; .tag_name == $tag)
                  then max_by([.published_at, .id]).tag_name
                  else error("Published Nightly \($tag) was not returned by GitHub")
                  end
              '
          )"
          if [[ "$RELEASE_TAG" != "$latest_nightly" ]]; then
            echo "::notice::Skipping pointer update for $RELEASE_TAG. The latest Nightly is $latest_nightly."
            exit 0
          fi
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '{tag_name, name, body}' > nightly.json
          if ! gh release view update-feed >/dev/null 2>&1; then
            gh release create update-feed --prerelease --latest=false \
              --title "T3CodeJP update feed" --notes "Nightly pointer used by the desktop updater."
          fi
          gh release upload update-feed nightly.json --clobber
