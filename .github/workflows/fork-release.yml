name: T3CodeJP release

on:
  push:
    tags:
      - "v[1-9]*.*.*"
      - "!v*-nightly.*"
      - "!v*-preview.*"
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        default: preview
        options:
          - preview
          - stable
          - nightly
      version:
        description: Stable promotion version override (for example 1.2.3)
        type: string

# Prereleases take their base version from the published Stable release. Queue
# every run so a promotion and the next Nightly cannot plan against stale state.
concurrency:
  group: fork-release
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Plan fork release
    if: github.repository == 'YmSaki/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      release_channel: ${{ steps.plan.outputs.release_channel }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release_name: ${{ steps.plan.outputs.release_name }}
      draft: ${{ steps.plan.outputs.draft }}
      is_prerelease: ${{ steps.plan.outputs.is_prerelease }}
      make_latest: ${{ steps.plan.outputs.make_latest }}
      has_update_feed: ${{ steps.plan.outputs.has_update_feed }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Resolve fork release metadata
        id: plan
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_VERSION: ${{ inputs.version }}
          PAUSE_NIGHTLY: ${{ vars.PAUSE_NIGHTLY }}
        with:
          retries: 3
          script: |
            const { planForkRelease } = require('./.github/scripts/fork-release-policy.cjs');
            const plan = await planForkRelease({
              github,
              context,
              dispatchChannel: process.env.DISPATCH_CHANNEL || 'preview',
              dispatchVersion: process.env.DISPATCH_VERSION,
              pauseNightly: process.env.PAUSE_NIGHTLY === 'true',
            });

            core.setOutput('should_build', plan.shouldBuild);
            core.setOutput('release_channel', plan.channel);
            if (!plan.shouldBuild) {
              core.notice(plan.reason);
              return;
            }

            for (const [key, value] of Object.entries({
              ref: plan.ref,
              version: plan.version,
              tag: plan.tag,
              release_name: plan.name,
              draft: plan.draft,
              is_prerelease: plan.isPrerelease,
              make_latest: plan.makeLatest,
              has_update_feed: plan.hasUpdateFeed,
            })) {
              core.setOutput(key, value);
            }
            core.notice(`Preflight only: ${plan.name} at ${plan.ref}. Build and publication jobs are pending.`);
