name: Deploy T3 Connect relay

on:
  push:
    branches:
      - main
  # Redeploys main after a variable or secret change. Alchemy redeploys the
  # Worker when a value it reads changes, so force is rarely needed.
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy every resource, including ones with no detected changes.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: none
  statuses: write

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  deploy_relay:
    name: Deploy production relay
    # A manual run from another branch would deploy that branch to production.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.repository == 'pingdotgg/t3code' ||
       (github.repository == 'YmSaki/t3codeJP' && vars.T3CODEJP_RELAY_DEPLOY == 'true'))
    runs-on: ${{ github.repository == 'YmSaki/t3codeJP' && 'ubuntu-24.04' || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
      RELAY_OBSERVABILITY_ENABLED: ${{ (github.repository == 'pingdotgg/t3code' || vars.T3CODEJP_RELAY_OBSERVABILITY_ENABLED == 'true') && 'true' || 'false' }}
      AXIOM_ORG_ID: ${{ (github.repository == 'pingdotgg/t3code' || vars.T3CODEJP_RELAY_OBSERVABILITY_ENABLED == 'true') && vars.AXIOM_ORG_ID || '' }}
      RELAY_TUNNEL_CLEANUP_MODE: ${{ vars.RELAY_TUNNEL_CLEANUP_MODE }}
      RELAY_LEGACY_TUNNEL_CLEANUP_MODE: ${{ vars.RELAY_LEGACY_TUNNEL_CLEANUP_MODE }}
      RELAY_ALERT_NOTIFIER_ID: ${{ vars.RELAY_ALERT_NOTIFIER_ID }}
      RELAY_WARNING_NOTIFIER_ID: ${{ vars.RELAY_WARNING_NOTIFIER_ID }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      APNS_ENABLED: ${{ (github.repository == 'pingdotgg/t3code' || vars.T3CODEJP_RELAY_APNS_ENABLED == 'true') && 'true' || 'false' }}
      APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Validate fork production endpoints
        if: github.repository == 'YmSaki/t3codeJP'
        id: fork
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
          T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
          RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
          RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
          AXIOM_TOKEN_CONFIGURED: ${{ secrets.AXIOM_TOKEN != '' }}
        with:
          script: |
            const { resolveForkRelayDeployConfig } = require('./.github/scripts/fork-release-connect.cjs');
            const config = resolveForkRelayDeployConfig(process.env);
            core.setOutput('domain', config.domain);
            core.setOutput('apiZone', config.apiZone);
            core.setOutput('tunnelZone', config.tunnelZone);
            core.setOutput('clerkPublishableKey', config.clerkPublishableKey);

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3code-relay...

      - name: Deploy production relay stage
        run: vp run --filter t3code-relay deploy --stage prod --yes --no-input ${{ inputs.force && '--force' || '' }}
        env:
          RELAY_DOMAIN: ${{ steps.fork.outputs.domain || vars.RELAY_DOMAIN }}
          RELAY_API_ZONE_NAME: ${{ steps.fork.outputs.apiZone || vars.RELAY_API_ZONE_NAME }}
          RELAY_TUNNEL_ZONE_NAME: ${{ steps.fork.outputs.tunnelZone || vars.RELAY_TUNNEL_ZONE_NAME }}
          CLERK_PUBLISHABLE_KEY: ${{ steps.fork.outputs.clerkPublishableKey || vars.CLERK_PUBLISHABLE_KEY }}
          # The PublishClientConfig action writes the client env here instead
          # of the repo-root .env; nothing on the runner reads it.
          T3CODE_RELAY_CLIENT_CONFIG_ENV: ${{ runner.temp }}/relay-client-config.env
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          AXIOM_TOKEN: ${{ (github.repository == 'pingdotgg/t3code' || vars.T3CODEJP_RELAY_OBSERVABILITY_ENABLED == 'true') && secrets.AXIOM_TOKEN || '' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          T3CHAT_LINK_SECRET: ${{ secrets.T3CHAT_LINK_SECRET }}

      - name: Publish relay deploy commit status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "Relay deploy / production",
              description: "Relay production deploy completed.",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
