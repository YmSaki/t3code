name: t3code-hub

services:
  t3code-hub:
    image: node:24-bookworm-slim
    container_name: t3code-hub
    restart: unless-stopped
    working_dir: /workspace
    command:
      [
        "npx",
        "--yes",
        "t3@${T3CODE_VERSION:-latest}",
        "serve",
        "--host",
        "0.0.0.0",
        "--port",
        "3773",
        "--no-browser",
      ]
    environment:
      T3CODE_HOME: /data/t3
      T3CODE_LOG_LEVEL: ${T3CODE_LOG_LEVEL:-info}
    volumes:
      - t3code-data:/data/t3
      - ${T3CODE_WORKSPACES:-./workspaces}:/workspace
    ports:
      - "127.0.0.1:${T3CODE_PORT:-3773}:3773"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3773/').then(()=>process.exit(0),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  t3code-data:
